      - name: Cherry-pick commits to new branch
        if: steps.analyze.outputs.needs_sync == 'true'
        id: cherry_pick
        shell: bash
        run: |
          set +e
          
          BRANCH_NAME="auto-hotfix-sync-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME" origin/rel/env-test
          
          CONFLICT_DETECTED=false
          CONFLICT_COMMITS=""
          SUCCESS_COMMITS=""
          SKIPPED_COMMITS=""

          IFS=',' read -ra COMMITS <<< "${{ steps.analyze.outputs.commits }}"

          for commit in "${COMMITS[@]}"; do
            echo ""
            echo "=========================================="
            echo "🔄 Processing commit: $commit"
            git log --oneline -1 "$commit"
            echo "=========================================="
            
            # Cherry-pick yap
            if git cherry-pick "$commit" 2>&1; then
              echo "✅ Cherry-pick successful"
              [ -n "$SUCCESS_COMMITS" ] && SUCCESS_COMMITS="${SUCCESS_COMMITS},"
              SUCCESS_COMMITS="${SUCCESS_COMMITS}${commit}"
              
            else
              CHERRY_EXIT=$?
              echo "⚠️ Cherry-pick failed with exit code: $CHERRY_EXIT"
              
              # Git durumunu kontrol et
              echo ""
              echo "Git status:"
              git status --short
              
              # Unmerged files var mı? (gerçek conflict)
              if git ls-files -u | grep -q .; then
                echo "🔴 REAL CONFLICT - Unmerged files detected:"
                git ls-files -u
                
                CONFLICT_DETECTED=true
                [ -n "$CONFLICT_COMMITS" ] && CONFLICT_COMMITS="${CONFLICT_COMMITS},"
                CONFLICT_COMMITS="${CONFLICT_COMMITS}${commit}"
                
                # Conflict'leri resolve et ve commit
                git add -A
                git commit --no-edit -m "WIP: Cherry-pick $commit (⚠️ CONFLICT)"
                
              else
                echo "ℹ️ No unmerged files"
                
                # Staged veya unstaged değişiklik var mı?
                if ! git diff --cached --quiet || ! git diff --quiet; then
                  echo "✅ Changes detected (non-conflict issue) - committing"
                  git add -A
                  git commit --no-edit -m "Cherry-pick $commit (auto-resolved)"
                  [ -n "$SUCCESS_COMMITS" ] && SUCCESS_COMMITS="${SUCCESS_COMMITS},"
                  SUCCESS_COMMITS="${SUCCESS_COMMITS}${commit}"
                else
                  echo "⊘ Empty commit (changes already in test) - skipping"
                  git cherry-pick --abort 2>/dev/null || true
                  git reset --hard 2>/dev/null || true
                  [ -n "$SKIPPED_COMMITS" ] && SKIPPED_COMMITS="${SKIPPED_COMMITS},"
                  SKIPPED_COMMITS="${SKIPPED_COMMITS}${commit}"
                fi
              fi
            fi
            
            echo ""
          done

          echo ""
          echo "=========================================="
          echo "📊 Final Summary:"
          echo "  ✅ Success: $(echo "$SUCCESS_COMMITS" | tr ',' ' ' | wc -w)"
          echo "  🔴 Conflicts: $(echo "$CONFLICT_COMMITS" | tr ',' ' ' | wc -w)"
          echo "  ⊘ Skipped (already applied): $(echo "$SKIPPED_COMMITS" | tr ',' ' ' | wc -w)"
