      - name: Create Pull Request
        if: steps.analyze.outputs.needs_sync == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-hotfix-sync-${{ github.run_number }}
          base: rel/env-test
          title: |
            ${{ env.conflict_detected == 'true' && '⚠️ [AUTO] Hotfix Sync - Review Needed' || '✅ [AUTO] Hotfix Sync from Production' }}
          body: |
            ## 🤖 Otomatik Hotfix Sync
            
            **Durum:** ${{ env.conflict_detected == 'true' && '⚠️ Conflict tespit edildi - Manuel review gerekiyor' || '✅ Conflict yok - Merge edilebilir' }}
            
            ### Cherry-pick edilen commit'ler:
            ${{ steps.analyze.outputs.commits }}
            
            ### Checklist:
            - [ ] Değişiklikler incelendi
            - [ ] Conflict çözüldü (varsa)
            - [ ] Test ortamında sorun çıkarmaz
            
            **Kaynak:** rel/env-prod
            **Hedef:** rel/env-test
          labels: |
            hotfix
            auto-sync
