name: Auto Hotfix Sync
run-name: Auto Hotfix Sync

on:
  push:
    branches:
      - rel/env-prod

jobs:
  sync-hotfix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "ubeniz"
          git config user.email "umitbeniz@araskargo.com.tr"
      
      - name: Fetch branches
        run: |
          git fetch origin rel/env-test
          git fetch origin rel/env-prod
      
      - name: Find and analyze commits
        id: analyze
        run: |
          MISSING=$(git log origin/rel/env-test..origin/rel/env-prod --format="%H|%s")
          
          if [ -z "$MISSING" ]; then
            echo "✅ Senkronize"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          COMMITS_TO_SYNC=""
          while IFS='|' read -r hash message; do
            PROD_PATCH_ID=$(git show $hash | git patch-id | cut -d' ' -f1)
            FOUND=false
            
            for test_commit in $(git log origin/rel/env-test --format="%H"); do
              TEST_PATCH_ID=$(git show $test_commit | git patch-id | cut -d' ' -f1)
              if [ "$TEST_PATCH_ID" = "$PROD_PATCH_ID" ]; then
                FOUND=true
                break
              fi
            done
            
            if [ "$FOUND" = false ]; then
              COMMITS_TO_SYNC="$COMMITS_TO_SYNC$hash,"
              echo "🔥 Hotfix: ${hash:0:7} - $message"
            fi
          done <<< "$MISSING"
          
          COMMITS_TO_SYNC=${COMMITS_TO_SYNC%,}
          
          if [ -z "$COMMITS_TO_SYNC" ]; then
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=true" >> $GITHUB_OUTPUT
            echo "commits=$COMMITS_TO_SYNC" >> $GITHUB_OUTPUT
          fi
      
      - name: Cherry-pick commits
        if: steps.analyze.outputs.needs_sync == 'true'
        id: cherry_pick
        run: |
          git checkout -b auto-hotfix-sync-${{ github.run_number }} origin/rel/env-test
          
          IFS=',' read -ra COMMITS <<< "${{ steps.analyze.outputs.commits }}"
          
          CONFLICT_DETECTED=false
          for commit in "${COMMITS[@]}"; do
            if ! git cherry-pick $commit; then
              CONFLICT_DETECTED=true
              git add -A
              git commit -m "WIP: Cherry-pick $commit (needs conflict resolution)" || true
            fi
          done
          
          echo "conflict_detected=$CONFLICT_DETECTED" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        if: steps.analyze.outputs.needs_sync == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: auto-hotfix-sync-${{ github.run_number }}
          base: rel/env-test
          title: |
            ${{ steps.cherry_pick.outputs.conflict_detected == 'true' && '⚠️' || '✅' }} [AUTO] Hotfix Sync from Production
          body: |
            ## 🤖 Otomatik Hotfix Sync
            
            **Durum:** ${{ steps.cherry_pick.outputs.conflict_detected == 'true' && '⚠️ Conflict tespit edildi' || '✅ Conflict yok' }}
            
            ### Cherry-pick edilen commit'ler:
            ${{ steps.analyze.outputs.commits }}
            
            ### Checklist:
            - [ ] Değişiklikler incelendi
            - [ ] Conflict çözüldü (varsa)
            - [ ] Test ortamında sorun çıkarmaz
            
            **Kaynak:** rel/env-prod → **Hedef:** rel/env-test
          labels: |
            hotfix
            auto-sync
            ${{ steps.cherry_pick.outputs.conflict_detected == 'true' && 'needs-review' || 'auto-merge-ready' }}
          assignees: ubeniz
      
      - name: Add comment with instructions
        if: steps.cherry_pick.outputs.conflict_detected == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create_pr.outputs.pull-request-number }},
              body: `## ⚠️ Conflict Çözümü Gerekiyor
              
              \`\`\`bash
              git checkout auto-hotfix-sync-${{ github.run_number }}
              # Conflict'leri düzelt
              git add .
              git commit
              git push
              \`\`\`
              
              Conflict çözüldükten sonra bu PR merge edilebilir.`
            });
