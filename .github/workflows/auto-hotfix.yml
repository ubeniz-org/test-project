name: Auto Hotfix Sync
run-name: Auto Hotfix Sync - Run #${{ github.run_number }}

on:
  push:
    branches:
      - rel/env-prod
  workflow_dispatch: # Manuel tetikleme için

jobs:
  sync-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Timeout ekle

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "ubeniz"
          git config user.email "umitbeniz@araskargo.com.tr"

      - name: Fetch branches
        run: |
          git fetch origin rel/env-test
          git fetch origin rel/env-prod

      - name: Find and analyze commits
        id: analyze
        run: |
          set -e
          
          MISSING=$(git log origin/rel/env-prod..origin/rel/env-test --format="%H|%s")

          if [ -z "$MISSING" ]; then
            echo "✅ Branches are synchronized"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Test branch'teki tüm patch-id'leri dosyaya yaz (bir kere)
          echo "📊 Building patch-id cache for rel/env-test..."
          CACHE_FILE=$(mktemp)
          git log origin/rel/env-test --format="%H" | while read -r test_commit; do
            git show $test_commit | git patch-id --stable | cut -d' ' -f1
          done > "$CACHE_FILE"
          
          echo "✅ Cache built: $(wc -l < "$CACHE_FILE") patches"

          COMMITS_TO_SYNC=""
          COMMIT_COUNT=0
          
          while IFS='|' read -r hash message; do
            PROD_PATCH_ID=$(git show $hash | git patch-id --stable | cut -d' ' -f1)
            
            # grep ile O(n) ama toplam O(n*m) - yine de orijinalden iyi
            if ! grep -q "^${PROD_PATCH_ID}$" "$CACHE_FILE"; then
              COMMITS_TO_SYNC="$COMMITS_TO_SYNC$hash,"
              ((COMMIT_COUNT++))
              echo "🔥 Hotfix detected: ${hash:0:7} - $message"
            else
              echo "✓ Already in test: ${hash:0:7} - $message"
            fi
          done <<< "$MISSING"

          rm -f "$CACHE_FILE"
          COMMITS_TO_SYNC=${COMMITS_TO_SYNC%,}

          if [ -z "$COMMITS_TO_SYNC" ]; then
            echo "✅ All commits already in test branch"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=true" >> $GITHUB_OUTPUT
            echo "commits=$COMMITS_TO_SYNC" >> $GITHUB_OUTPUT
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Cherry-pick commits to new branch
        if: steps.analyze.outputs.needs_sync == 'true'
        id: cherry_pick
        run: |
          set +e  # Cherry-pick hataları için devam et
          
          BRANCH_NAME="auto-hotfix-sync-${{ github.run_number }}"
          git checkout -b $BRANCH_NAME origin/rel/env-test
          
          CONFLICT_DETECTED=false
          CONFLICT_COMMITS=""
          SUCCESS_COMMITS=""

          IFS=',' read -ra COMMITS <<< "${{ steps.analyze.outputs.commits }}"

          for commit in "${COMMITS[@]}"; do
            echo "🔄 Cherry-picking $commit..."
            
            if git cherry-pick $commit; then
              echo "✅ Success: $commit"
              SUCCESS_COMMITS="$SUCCESS_COMMITS$commit,"
            else
              echo "⚠️ Conflict detected in: $commit"
              CONFLICT_DETECTED=true
              CONFLICT_COMMITS="$CONFLICT_COMMITS$commit,"
              
              # Conflict varsa tüm değişiklikleri staged duruma al
              git add -A
              
              # Staged değişiklik var mı kontrol et
              if ! git diff --cached --quiet; then
                # WIP commit oluştur
                git commit --no-edit -m "WIP: Cherry-pick $commit (⚠️ CONFLICT - needs manual resolution)"
              else
                # Değişiklik yoksa cherry-pick'i skip et
                git cherry-pick --skip
              fi
            fi
          done

          # Output'ları set et
          echo "conflict_detected=$CONFLICT_DETECTED" >> $GITHUB_OUTPUT
          echo "conflict_commits=${CONFLICT_COMMITS%,}" >> $GITHUB_OUTPUT
          echo "success_commits=${SUCCESS_COMMITS%,}" >> $GITHUB_OUTPUT
          
          # Branch'i push et
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.analyze.outputs.needs_sync == 'true'
        id: create_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const conflictDetected = '${{ steps.cherry_pick.outputs.conflict_detected }}' === 'true';
            const conflictCommits = '${{ steps.cherry_pick.outputs.conflict_commits }}'.split(',').filter(Boolean);
            const successCommits = '${{ steps.cherry_pick.outputs.success_commits }}'.split(',').filter(Boolean);
            
            const title = conflictDetected 
              ? '⚠️ [AUTO] Hotfix Sync - Conflict Resolution Required'
              : '✅ [AUTO] Hotfix Sync from Production';
            
            const statusEmoji = conflictDetected ? '⚠️' : '✅';
            const statusText = conflictDetected
              ? `${conflictCommits.length} conflict(s) detected`
              : 'No conflicts - Ready to merge';

            let commitList = '';
            
            if (successCommits.length > 0) {
              commitList += '### ✅ Successfully cherry-picked:\n';
              commitList += successCommits.map(c => `- [x] \`${c.substring(0, 7)}\``).join('\n');
              commitList += '\n\n';
            }
            
            if (conflictCommits.length > 0) {
              commitList += '### ⚠️ Conflicts (need manual resolution):\n';
              commitList += conflictCommits.map(c => `- [ ] \`${c.substring(0, 7)}\` ⚠️`).join('\n');
              commitList += '\n\n';
            }

            const prBody = `## 🤖 Automatic Hotfix Synchronization

            **Status:** ${statusEmoji} ${statusText}
            **Total commits:** ${{ steps.analyze.outputs.commit_count }}
            **Workflow run:** #${{ github.run_number }}
            
            ${commitList}
            
            ### 📋 Review Checklist:
            - [ ] All changes reviewed
            - [ ] Conflicts resolved (if any)
            - [ ] No breaking changes for test environment
            - [ ] CI checks passed
            
            ---
            **Source:** \`rel/env-prod\` → **Target:** \`rel/env-test\`
            
            ${conflictDetected ? '> ⚠️ **Action required:** Manual conflict resolution needed before merge' : '> ✅ **Ready to merge:** No conflicts detected'}`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: 'auto-hotfix-sync-${{ github.run_number }}',
              base: 'rel/env-test',
              body: prBody
            });

            const labels = ['hotfix', 'auto-sync'];
            if (conflictDetected) {
              labels.push('needs-resolution');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: labels
            });

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: ['ubeniz']
            });

            core.setOutput('pull-request-number', pr.number);
            core.setOutput('pull-request-url', pr.html_url);

      - name: Add conflict resolution instructions
        if: steps.cherry_pick.outputs.conflict_detected == 'true'
        uses: actions/github-script@v7
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          CONFLICT_COMMITS: ${{ steps.cherry_pick.outputs.conflict_commits }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const conflictCommits = process.env.CONFLICT_COMMITS.split(',').filter(Boolean);
            const commitList = conflictCommits.map(c => `- \`${c.substring(0, 7)}\``).join('\n');
            
            const commentBody = `## ⚠️ Conflict Resolution Required

            The following commits need manual conflict resolution:
            ${commitList}

            ### Resolution Steps:

            \`\`\`bash
            # 1. Checkout the branch
            git fetch origin
            git checkout auto-hotfix-sync-${process.env.RUN_NUMBER}

            # 2. Check the conflicted commits (marked as WIP)
            git log --oneline -10

            # 3. If needed, reset to clean state and re-apply
            git reset --hard origin/rel/env-test
            
            # 4. Manually cherry-pick with conflict resolution
            ${conflictCommits.map(c => `git cherry-pick ${c} # resolve conflicts, then: git add . && git cherry-pick --continue`).join('\n            ')}

            # 5. Push the resolved changes
            git push origin auto-hotfix-sync-${process.env.RUN_NUMBER} --force-with-lease
            \`\`\`

            ### Alternative: Use GitHub Web Interface
            You can also resolve conflicts directly in GitHub's web interface.

            ---
            Once conflicts are resolved, this PR will be ready to merge. ✅`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: process.env.PR_NUMBER,
              body: commentBody
            });

      - name: Summary
        if: always()
        run: |
          echo "### 🤖 Hotfix Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.analyze.outputs.needs_sync }}" == "true" ]; then
            echo "- **Status:** Sync needed ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Commits to sync:** ${{ steps.analyze.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- **PR:** ${{ steps.create_pr.outputs.pull-request-url }}" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.cherry_pick.outputs.conflict_detected }}" == "true" ]; then
              echo "- **Conflicts:** ⚠️ Yes - manual resolution required" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Conflicts:** ✅ None - ready to merge" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Status:** Already synchronized ✅" >> $GITHUB_STEP_SUMMARY
          fi
