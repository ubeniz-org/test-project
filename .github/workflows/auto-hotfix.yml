      - name: Create Pull Request
        if: steps.analyze.outputs.needs_sync == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-hotfix-sync-${{ github.run_number }}
          base: rel/env-test
          title: |
            ${{ env.conflict_detected == 'true' && '⚠️ [AUTO] Hotfix Sync - Review Needed' || '✅ [AUTO] Hotfix Sync from Production' }}
          body: |
            ## 🤖 Otomatik Hotfix Sync
            
            **Durum:** ${{ env.conflict_detected == 'true' && '⚠️ Conflict tespit edildi - Manuel review gerekiyor' || '✅ Conflict yok - Merge edilebilir' }}
            
            ### Cherry-pick edilen commit'ler:
            ${{ steps.analyze.outputs.commits }}
            
            ### Checklist:
            - [ ] Değişiklikler incelendi
            - [ ] Conflict çözüldü (varsa)
            - [ ] Test ortamında sorun çıkarmaz
            
            **Kaynak:** rel/env-prod
            **Hedef:** rel/env-test
          labels: |
            hotfix
            auto-sync
            ${{ env.conflict_detected == 'true' && 'needs-review' || 'auto-merge-ready' }}
          assignees: ubeniz
      
      - name: Add comment with instructions
        if: env.conflict_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create_pr.outputs.pull-request-number }},
              body: `## ⚠️ Conflict Çözümü Gerekiyor
              
              \`\`\`bash
              git checkout auto-hotfix-sync-${{ github.run_number }}
              # Conflict'leri düzelt
              git add .
              git commit
              git push
              \`\`\`
              
              Conflict çözüldükten sonra bu PR merge edilebilir.`
            });
